# /etc/nginx/sites-available/grafana.erbsultan.uz
# HTTP reverse proxy. Certbot will add the HTTPS server block and redirect.

server {
    listen 80;
    listen [::]:80;
    server_name grafana.erbsultan.uz;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/grafana.erbsultan.uz.access.log;
    error_log  /var/log/nginx/grafana.erbsultan.uz.error.log;
}
