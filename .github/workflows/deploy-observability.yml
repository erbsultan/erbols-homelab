name: deploy observability

# Triggers:
#   - push to main that touches observability/** (except local secrets)
#   - push to main that touches this workflow itself
#   - manual run from the Actions tab
on:
  push:
    branches: [main]
    paths:
      - 'observability/**'
      - '.github/workflows/deploy-observability.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: rsync observability -> homelab-fra-01
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: rsync observability config to VPS
        run: |
          rsync -avz --delete \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            observability/ \
            erbol@108.61.211.82:/opt/erbols-homelab/observability/

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          PROJECT_NAME: observability
          PROJECT_URL: https://grafana.erbsultan.uz
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              print("Telegram secrets are not configured; skipping notification.")
              sys.exit(0)

          event = {}
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          if event_path and os.path.exists(event_path):
              with open(event_path, "r", encoding="utf-8") as f:
                  event = json.load(f)

          head_commit = event.get("head_commit") or {}
          message = (head_commit.get("message") or "Manual workflow run").splitlines()[0]
          sha = os.environ["SHA"]
          short_sha = sha[:7]
          status = os.environ["JOB_STATUS"]
          status_label = {
              "success": "SUCCESS",
              "failure": "FAILED",
              "cancelled": "CANCELLED",
          }.get(status, status.upper())

          repo = os.environ["REPOSITORY"]
          run_url = f'{os.environ["SERVER_URL"]}/{repo}/actions/runs/{os.environ["RUN_ID"]}'
          commit_url = f'{os.environ["SERVER_URL"]}/{repo}/commit/{sha}'

          text = "\n".join([
              f"{os.environ['PROJECT_NAME']} sync: {status_label}",
              "",
              f"Repository: {repo}",
              f"Workflow: {os.environ['WORKFLOW']} #{os.environ['RUN_NUMBER']}",
              f"Branch: {os.environ['REF_NAME']}",
              f"Commit: {short_sha} - {message}",
              f"Actor: {os.environ['ACTOR']}",
              f"Event: {os.environ['EVENT_NAME']}",
              "",
              f"Service: {os.environ['PROJECT_URL']}",
              "Target: /opt/erbols-homelab/observability",
              "Apply: docker compose up -d --force-recreate grafana",
              f"Run: {run_url}",
              f"Commit: {commit_url}",
          ])

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "true",
          }).encode("utf-8")

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          with urllib.request.urlopen(url, data=data, timeout=15) as response:
              print(response.read().decode("utf-8"))
          PY
