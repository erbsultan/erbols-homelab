name: landing ci/cd

# Pipeline:
#   develop -> GitHub -> build -> test -> deploy -> smoke -> Telegram status
#
# Triggers:
#   - push to main that touches landing/site/** (the actual content)
#   - push to main that touches this workflow itself
#   - manual run from the Actions tab
on:
  push:
    branches: [main]
    paths:
      - 'landing/site/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

env:
  SITE_URL: https://erbsultan.uz

jobs:
  build:
    name: build static site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package landing/site
        run: |
          mkdir -p dist/site
          rsync -a --delete \
            --exclude '.DS_Store' \
            landing/site/ \
            dist/site/
          find dist/site -type f | sort

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-site
          path: dist/site
          if-no-files-found: error
          retention-days: 7

  test:
    name: test static site
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check landing/site/theme.js
          node --check landing/site/stars.js

      - name: Validate site files and local links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          site_dir = Path("landing/site")
          required = [
              "index.html",
              "ru.html",
              "style.css",
              "theme.js",
              "stars.js",
              "me.jpg",
          ]

          missing = [name for name in required if not (site_dir / name).is_file()]
          if missing:
              raise SystemExit(f"Missing required site files: {', '.join(missing)}")

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []

              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name in {"href", "src"} and value:
                          self.refs.append(value)

          errors = []
          for page in ["index.html", "ru.html"]:
              parser = AssetParser()
              parser.feed((site_dir / page).read_text(encoding="utf-8"))
              for ref in parser.refs:
                  parsed = urlparse(ref)
                  if parsed.scheme or parsed.netloc or ref.startswith(("mailto:", "tel:")):
                      continue
                  path = parsed.path
                  if not path or path.startswith("#"):
                      continue
                  target = site_dir / ("index.html" if path == "/" else path.lstrip("/"))
                  if not target.exists():
                      errors.append(f"{page}: local reference does not exist: {ref}")

          if errors:
              raise SystemExit("\n".join(errors))
          print("Static site checks passed.")
          PY

  deploy:
    name: deploy to production
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: landing-site
          path: dist/site

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: rsync site to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/site/ \
            erbol@108.61.211.82:/var/www/erbsultan.uz/html/

  smoke:
    name: smoke check production
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check deployed site
        run: |
          python3 - <<'PY'
          import os
          import ssl
          import time
          import urllib.request

          url = os.environ["SITE_URL"]
          expected = "Erbol Sultanbayev"
          started = time.monotonic()
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "erbols-homelab-deploy-smoke/1.0"},
          )

          with urllib.request.urlopen(
              request,
              timeout=15,
              context=ssl.create_default_context(),
          ) as response:
              body = response.read(500_000).decode("utf-8", errors="replace")
              status = response.getcode()

          elapsed_ms = round((time.monotonic() - started) * 1000)
          if status < 200 or status >= 400:
              raise SystemExit(f"Unexpected HTTP status {status}")
          if expected not in body:
              raise SystemExit(f"Missing expected text: {expected}")
          print(f"OK landing {status} {elapsed_ms}ms {url}")
          PY

  notify:
    name: notify Telegram
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - deploy
      - smoke
    if: always()
    steps:
      - name: Notify Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          SERVER_URL: ${{ github.server_url }}
          SITE_URL: ${{ env.SITE_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              print("Telegram secrets are not configured; skipping notification.")
              sys.exit(0)

          event = {}
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          if event_path and os.path.exists(event_path):
              with open(event_path, "r", encoding="utf-8") as f:
                  event = json.load(f)

          head_commit = event.get("head_commit") or {}
          message = (head_commit.get("message") or "Manual workflow run").splitlines()[0]
          sha = os.environ["SHA"]
          short_sha = sha[:7]

          results = {
              "build": os.environ["BUILD_RESULT"],
              "test": os.environ["TEST_RESULT"],
              "deploy": os.environ["DEPLOY_RESULT"],
              "smoke": os.environ["SMOKE_RESULT"],
          }
          failed = any(result in {"failure", "cancelled"} for result in results.values())
          status_label = "FAILED" if failed else "SUCCESS"

          repo = os.environ["REPOSITORY"]
          run_url = f'{os.environ["SERVER_URL"]}/{repo}/actions/runs/{os.environ["RUN_ID"]}'
          commit_url = f'{os.environ["SERVER_URL"]}/{repo}/commit/{sha}'
          stage_lines = [f"{name}: {result.upper()}" for name, result in results.items()]

          text = "\n".join([
              f"Landing CI/CD pipeline: {status_label}",
              "",
              *stage_lines,
              "",
              f"Repository: {repo}",
              f"Workflow: {os.environ['WORKFLOW']} #{os.environ['RUN_NUMBER']}",
              f"Branch: {os.environ['REF_NAME']}",
              f"Commit: {short_sha} - {message}",
              f"Actor: {os.environ['ACTOR']}",
              f"Event: {os.environ['EVENT_NAME']}",
              "",
              f"Site: {os.environ['SITE_URL']}",
              f"Run: {run_url}",
              f"Commit: {commit_url}",
          ])

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "true",
          }).encode("utf-8")

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          with urllib.request.urlopen(url, data=data, timeout=15) as response:
              print(response.read().decode("utf-8"))
          PY
